<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280"><rect width="100%" height="100%" fill="white"/><text x="380" y="25" fill="#1f2937" font-size="18" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">Priority chain: /EI high disables a chip</text><rect x="20" y="74" width="155" height="75" rx="5" fill="#f2f5fb" stroke="#53667b"/><text x="97.5" y="117.5" fill="#1f2937" font-size="17" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">Group 3: LS148</text><text x="97" y="173" fill="#1f2937" font-size="15" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">Inputs 24..31</text><path d="M175,110 L205,110" stroke="#374151" fill="none" stroke-width="1.6"/><text x="189" y="67" fill="#1f2937" font-size="12" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">EO→EI</text><rect x="205" y="74" width="155" height="75" rx="5" fill="#f2f5fb" stroke="#53667b"/><text x="282.5" y="117.5" fill="#1f2937" font-size="17" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">Group 2: LS148</text><text x="282" y="173" fill="#1f2937" font-size="15" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">Inputs 16..23</text><path d="M360,110 L390,110" stroke="#374151" fill="none" stroke-width="1.6"/><text x="374" y="67" fill="#1f2937" font-size="12" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">EO→EI</text><rect x="390" y="74" width="155" height="75" rx="5" fill="#f2f5fb" stroke="#53667b"/><text x="467.5" y="117.5" fill="#1f2937" font-size="17" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">Group 1: LS148</text><text x="467" y="173" fill="#1f2937" font-size="15" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">Inputs 8..15</text><path d="M545,110 L575,110" stroke="#374151" fill="none" stroke-width="1.6"/><text x="559" y="67" fill="#1f2937" font-size="12" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">EO→EI</text><rect x="575" y="74" width="155" height="75" rx="5" fill="#f2f5fb" stroke="#53667b"/><text x="652.5" y="117.5" fill="#1f2937" font-size="17" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">Group 0: LS148</text><text x="652" y="173" fill="#1f2937" font-size="15" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">Inputs 0..7</text><text x="380" y="220" fill="#1f2937" font-size="15" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">Highest group EI=0; lower groups enabled only if higher groups idle.</text><text x="380" y="252" fill="#1f2937" font-size="15" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">/GS indicates selected group; use group-valid gating to combine codes.</text></svg>